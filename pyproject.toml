[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-appsec-lab"
version = "0.2.2"
description = "Authorized local application security assessment engine and portable Agent Skill"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "AVIQEN"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "certifi>=2025.1", "cvss>=3.6,<4"]

[project.urls]
Homepage = "https://github.com/aviqentech/local-appsec-lab"
Repository = "https://github.com/aviqentech/local-appsec-lab"
Documentation = "https://github.com/aviqentech/local-appsec-lab/tree/main/docs"
Issues = "https://github.com/aviqentech/local-appsec-lab/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2", "Flask>=3,<4"]
browser = ["playwright>=1.49,<2"]

[project.scripts]
appsec-lab = "local_appsec_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_appsec_lab = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["runtime: requires a functioning OS sandbox", "docker: requires Docker and preloaded images"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
