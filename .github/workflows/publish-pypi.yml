name: Publish to PyPI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated distributions to production PyPI
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'aviqentech/local-appsec-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install version-planning dependency
        run: python -m pip install 'packaging>=24'
      - name: Select merged PR, wait for CI and prepare next version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: python scripts/release_automation.py prepare
      - name: Install release tooling
        if: steps.release.outputs.eligible == 'true'
        run: python -m pip install '.[dev]' build twine
      - name: Check source and bundled resources
        if: steps.release.outputs.eligible == 'true'
        run: make lint
      - name: Run source and installer tests
        if: steps.release.outputs.eligible == 'true'
        run: python -m pytest -q
      - name: Build and validate exact distributions
        if: steps.release.outputs.eligible == 'true'
        run: |
          python -m build
          python -m twine check --strict dist/*
          python scripts/validate_distribution.py
      - name: Install the wheel outside the checkout
        if: steps.release.outputs.eligible == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/pypi-smoke"
          "$RUNNER_TEMP/pypi-smoke/bin/python" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/pypi-fixture"
          cd "$RUNNER_TEMP/pypi-fixture"
          test "$("$RUNNER_TEMP/pypi-smoke/bin/appsec-lab" --version)" = "$RELEASE_VERSION"
          "$RUNNER_TEMP/pypi-smoke/bin/appsec-lab" inspect
          "$RUNNER_TEMP/pypi-smoke/bin/python" -m local_appsec_lab.install --project "$RUNNER_TEMP/pypi-fixture" --target all
          "$RUNNER_TEMP/pypi-smoke/bin/python" -m local_appsec_lab.install --project "$RUNNER_TEMP/pypi-fixture" --target all --operation doctor
          "$RUNNER_TEMP/pypi-smoke/bin/python" -m local_appsec_lab.install --project "$RUNNER_TEMP/pypi-fixture" --target all --operation uninstall
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.eligible == 'true'
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.eligible == 'true'
        with:
          name: release-version-files
          path: |
            pyproject.toml
            src/local_appsec_lab/__init__.py
            README.md
            CHANGELOG.md
          if-no-files-found: error
  record:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.record.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: release-version-files
          path: .
      - name: Record validated version on main without force pushing
        id: record
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: python scripts/release_automation.py commit
  publish:
    if: needs.build.outputs.publish == 'true'
    needs: [build, record]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: pypi
      url: https://pypi.org/project/local-appsec-lab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Refuse conflicting existing files before retrying an upload
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request
          from pathlib import Path
          url = 'https://pypi.org/pypi/local-appsec-lab/' + os.environ['RELEASE_VERSION'] + '/json'
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  indexed = {item['filename']: item for item in json.load(response)['urls']}
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              indexed = {}
          files = {path.name: path for path in Path('dist').iterdir() if path.is_file()}
          if set(indexed) - set(files):
              raise SystemExit('Registry contains unexpected files for this version')
          for name, item in indexed.items():
              if hashlib.sha256(files[name].read_bytes()).hexdigest() != item['digests']['sha256']:
                  raise SystemExit('Existing immutable file differs; refusing upload')
          PY
      - name: Publish with PyPI trusted identity
        # No checkout, package build or target-code execution in the OIDC job.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          # The preceding digest guard makes partial-upload retries safe.
          skip-existing: true
  verify:
    if: needs.build.outputs.publish == 'true'
    needs: [build, record, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.record.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Verify registry hashes and fresh public installation
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/verify_pypi_release.py "$RELEASE_VERSION"
