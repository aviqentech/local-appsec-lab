name: Source assessment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - name: Source-only assessment (partial coverage accepted)
        shell: bash
        run: |
          set +e
          appsec-lab scan --mode review
          code=$?
          test "$code" -eq 0 -o "$code" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-assessment
          path: .appsec-lab/reports/
